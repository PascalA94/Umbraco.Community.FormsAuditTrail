# Dependabot reads this file from the default branch only, so the v17 maintenance
# branch is covered here via target-branch entries.
#
# Umbraco and EF Core use range floors ([x, next-major)). Raising a floor forces every
# consuming site to upgrade, so treat those PRs as proposals: merge them when a floor
# genuinely needs to move (e.g. a security fix), otherwise close them.
# Major updates are ignored because a new Umbraco major is a new branch, not a bump.
version: 2

updates:
  # main - Umbraco 18
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "Umbraco.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      # Test project stays on xunit v2; v3 is a migration, not a bump
      - dependency-name: "xunit"
        update-types: ["version-update:semver-major"]
    groups:
      umbraco:
        patterns: ["Umbraco.*", "Microsoft.EntityFrameworkCore.*"]
      test-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/Umbraco.Community.FormsAuditTrail/Client
    schedule:
      interval: monthly
    ignore:
      # The backoffice major must match the Umbraco major this branch targets
      - dependency-name: "@umbraco-cms/backoffice"
        update-types: ["version-update:semver-major"]
    groups:
      client-dependencies:
        patterns: ["*"]

  # v17 - Umbraco 17 maintenance
  - package-ecosystem: github-actions
    directory: /
    target-branch: v17
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src
    target-branch: v17
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "Umbraco.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit"
        update-types: ["version-update:semver-major"]
    groups:
      umbraco:
        patterns: ["Umbraco.*", "Microsoft.EntityFrameworkCore.*"]
      test-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/Umbraco.Community.FormsAuditTrail/Client
    target-branch: v17
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "@umbraco-cms/backoffice"
        update-types: ["version-update:semver-major"]
    groups:
      client-dependencies:
        patterns: ["*"]
