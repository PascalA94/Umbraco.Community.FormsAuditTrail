name: Feature request
description: Suggest something Forms Audit Trail should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: input
    id: umbraco
    attributes:
      label: Umbraco and Forms versions you use
