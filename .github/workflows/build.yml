name: Build and Test

# One branch builds both Umbraco lines (17 and 18), selected by the UmbracoMajor environment variable (MSBuild reads
# environment variables as properties; see Directory.Build.props).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CLIENT_DIR: src/Umbraco.Community.FormsAuditTrail/Client
  PKG_DIR: src/Umbraco.Community.FormsAuditTrail
  SLN: src/Umbraco.Community.FormsAuditTrail.slnx

jobs:
  # The client is one bundle for both lines (built against @umbraco-cms/backoffice ^17.8.0, the lower line), so it is
  # built, linted, tested and checked once here. The build jobs below embed the committed wwwroot; this job proves it
  # is fresh.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Umbraco.Community.FormsAuditTrail/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Umbraco.Community.FormsAuditTrail/Client/package-lock.json

      # --ignore-scripts: no dependency install script runs in CI.
      - name: Install client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci --ignore-scripts

      - name: Audit client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm audit --audit-level=high

      - name: Lint client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run lint

      - name: Test client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm test

      # Pitfall S3 / SEC-I2: stored text is rendered through Lit text bindings only. ESLint bans the imports and sinks in
      # TypeScript and JavaScript; this catches the rest, including strings in templates and non-code files.
      - name: Check no unsafe HTML rendering
        working-directory: ${{ env.CLIENT_DIR }}
        run: "! grep -rnE 'unsafeHTML|unsafeSVG|unsafeStatic|innerHTML|outerHTML|insertAdjacentHTML|createContextualFragment|setHTMLUnsafe|parseHTMLUnsafe|document\\.write' src/"

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run build

      # The built client in wwwroot is committed; fail if it differs from a fresh build.
      - name: Check committed wwwroot matches the build
        run: |
          git diff --exit-code -- src/Umbraco.Community.FormsAuditTrail/wwwroot
          # git diff ignores untracked files, so a new hashed chunk from a drifted build needs its own check.
          test -z "$(git status --porcelain -- src/Umbraco.Community.FormsAuditTrail/wwwroot)"

      # Backoffice code must be imported at runtime from the host, never bundled into wwwroot.
      - name: Check @umbraco-cms/backoffice stayed external
        run: |
          if grep -rqE "from [\"']@umbraco-cms/backoffice/" src/Umbraco.Community.FormsAuditTrail/Client/src; then
            grep -rqE --include='*.js' "[\"']@umbraco-cms/backoffice/" src/Umbraco.Community.FormsAuditTrail/wwwroot/
          fi

      # One bundle serves both lines (built against ^17.8.0). Type-check the source against the 18 line too, in a temp
      # copy, so an 18-only break shows on the PR.
      - name: Type-check against @umbraco-cms/backoffice 18
        run: |
          tmp="$(mktemp -d)"
          cp -R "$CLIENT_DIR/." "$tmp/"
          cd "$tmp"
          rm -rf node_modules
          npm ci --ignore-scripts
          npm i --no-save --ignore-scripts "@umbraco-cms/backoffice@^18.3.0"
          npx tsc --noEmit

  build:
    name: build (${{ matrix.line }} ${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        line: ['17', '18']
        # floor: locked restore at the committed packages.<line>.lock.json, so the package is tested at its declared minimums.
        # latest: newest <line>.x of Umbraco and Forms, restored unlocked; the lock files it rewrites are never committed.
        leg: [floor, latest]
    # MSBuild reads environment variables as properties: UmbracoMajor picks the line, and the latest leg floats the package
    # ranges and the test and demo versions to <line>.*. Empty values fall through to the Directory.Build.props defaults
    # (the floor). Being environment variables, they also reach dotnet ef and every other step without repeating them.
    env:
      UmbracoMajor: ${{ matrix.line }}
      UmbracoRange: ${{ matrix.leg == 'latest' && format('{0}.*', matrix.line) || '' }}
      FormsRange: ${{ matrix.leg == 'latest' && format('{0}.*', matrix.line) || '' }}
      UmbracoTestVersion: ${{ matrix.leg == 'latest' && format('{0}.*', matrix.line) || '' }}
      FormsTestVersion: ${{ matrix.leg == 'latest' && format('{0}.*', matrix.line) || '' }}
      UmbracoDemoVersion: ${{ matrix.leg == 'latest' && format('{0}.*', matrix.line) || '' }}
      FormsDemoVersion: ${{ matrix.leg == 'latest' && format('{0}.*', matrix.line) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'
          # NuGet cache keyed on the lock files. Not used in publish.yml, so a release never restores from a PR-filled cache.
          cache: true
          cache-dependency-path: '**/packages.*.lock.json'

      - name: Restore (locked)
        if: matrix.leg == 'floor'
        # NU1903 and NU1904 are High and Critical advisories; the csproj keeps them as warnings so a local build is not
        # blocked by an advisory published overnight, but CI must not pass with one.
        run: dotnet restore "$SLN" --locked-mode -warnaserror:NU1903,NU1904

      - name: Lock files unchanged
        if: matrix.leg == 'floor'
        run: git diff --exit-code -- '**/packages.*.lock.json'

      - name: Restore (latest minor, unlocked)
        if: matrix.leg == 'latest'
        run: dotnet restore "$SLN" --force-evaluate -p:RestoreLockedMode=false -warnaserror:NU1903,NU1904

      # dotnet list reads the assets file the restore just wrote, so on the latest leg this audits the newest <line>.x
      # graph, not the floor. Any severity fails (R19).
      - name: Vulnerable packages (direct and transitive)
        run: bash build/check-vulnerable.sh

      - name: Build
        run: dotnet build "$SLN" -c Release --no-restore

      # A model change without a migration for both providers fails here (repo rule: dual-provider migrations).
      # --no-build finds this line's output (bin/<line>/Release) because UmbracoMajor is in the job environment.
      - name: Restore local tools
        run: dotnet tool restore

      - name: Model matches the SQLite migrations
        working-directory: ${{ env.PKG_DIR }}
        run: dotnet ef migrations has-pending-model-changes --context SqliteFormsAuditDbContext --configuration Release --no-build

      - name: Model matches the SQL Server migrations
        working-directory: ${{ env.PKG_DIR }}
        run: dotnet ef migrations has-pending-model-changes --context SqlServerFormsAuditDbContext --configuration Release --no-build

      # SQL Server tests run only in release-checks.yml (R21), so a pull request never needs a database server.
      - name: Test
        run: dotnet test "$SLN" -c Release --no-build --filter "Category!=SqlServer&Category!=Slow" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.line }}-${{ matrix.leg }}
          path: '**/results.trx'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash build/gitleaks.sh "$BASE_SHA..$HEAD_SHA"

  osv:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=packages.lock.json:./src/Umbraco.Community.FormsAuditTrail/packages.17.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.FormsAuditTrail/packages.18.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.FormsAuditTrail.Tests/packages.17.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.FormsAuditTrail.Tests/packages.18.lock.json
        --lockfile=packages.lock.json:./demo/Umbraco.Community.FormsAuditTrail.DemoSite/packages.17.lock.json
        --lockfile=packages.lock.json:./demo/Umbraco.Community.FormsAuditTrail.DemoSite/packages.18.lock.json
        --recursive
        ./

  deps:
    name: deps (${{ matrix.line }})
    needs: osv
    runs-on: ubuntu-latest
    env:
      UmbracoMajor: ${{ matrix.line }}
    strategy:
      fail-fast: false
      matrix:
        line: ['17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'
          # NuGet cache keyed on the lock files. Not used in publish.yml, so a release never restores from a PR-filled cache.
          cache: true
          cache-dependency-path: '**/packages.*.lock.json'
      - name: Restore (locked)
        run: dotnet restore "$SLN" --locked-mode -warnaserror:NU1903,NU1904
      - name: Vulnerable packages (direct and transitive)
        run: bash build/check-vulnerable.sh

  build-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests for build scripts
        working-directory: build/tests
        run: python3 -B -m unittest -v
