name: Build and Test

on:
  pull_request:
    branches: [main, v17]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Umbraco.Community.FormsAuditTrail/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Umbraco.Community.FormsAuditTrail/Client/package-lock.json

      # The built client in wwwroot is committed; fail if it is out of date with the source
      - name: Build client and check wwwroot is up to date
        working-directory: src/Umbraco.Community.FormsAuditTrail/Client
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../wwwroot

      - name: Restore
        run: dotnet restore src/Umbraco.Community.FormsAuditTrail.slnx

      - name: Build
        run: dotnet build src/Umbraco.Community.FormsAuditTrail.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/Umbraco.Community.FormsAuditTrail.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/results.trx'
