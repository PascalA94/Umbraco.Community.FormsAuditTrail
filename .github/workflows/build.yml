name: Build and Test

on:
  pull_request:
    branches: [main, v17]
  push:
    branches: [main, v17]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CLIENT_DIR: src/Umbraco.Community.FormsAuditTrail/Client
  # The latest leg lifts every Umbraco and Forms reference to the newest 18.x; see Directory.Build.props.
  LATEST_PROPS: '"-p:UmbracoTestVersion=18.*" "-p:FormsTestVersion=18.*" "-p:UmbracoDemoVersion=18.*" "-p:FormsDemoVersion=18.*"'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor: locked restore at the committed lock files, so the package is tested at its declared minimums.
        # latest: newest 18.x of Umbraco and Forms, restored unlocked; the lock files it rewrites are never committed.
        leg: [floor, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'
          # NuGet cache keyed on the lock files. Not used in publish.yml, so a release never restores from a PR-filled cache.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Umbraco.Community.FormsAuditTrail/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Umbraco.Community.FormsAuditTrail/Client/package-lock.json

      # --ignore-scripts: no dependency install script runs in CI.
      - name: Install client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci --ignore-scripts

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run build

      # The built client in wwwroot is committed; fail if it differs from a fresh build.
      - name: Check committed wwwroot matches the build
        run: |
          git diff --exit-code -- src/Umbraco.Community.FormsAuditTrail/wwwroot
          # git diff ignores untracked files, so a new hashed chunk from a drifted build needs its own check.
          test -z "$(git status --porcelain -- src/Umbraco.Community.FormsAuditTrail/wwwroot)"

      # Backoffice code must be imported at runtime from the host, never bundled into wwwroot.
      - name: Check @umbraco-cms/backoffice stayed external
        run: |
          if grep -rqE "from [\"']@umbraco-cms/backoffice/" src/Umbraco.Community.FormsAuditTrail/Client/src; then
            grep -rqE --include='*.js' "[\"']@umbraco-cms/backoffice/" src/Umbraco.Community.FormsAuditTrail/wwwroot/
          fi

      - name: Restore (locked)
        if: matrix.leg == 'floor'
        run: dotnet restore src/Umbraco.Community.FormsAuditTrail.slnx --locked-mode

      - name: Lock files unchanged
        if: matrix.leg == 'floor'
        run: git diff --exit-code -- '**/packages.lock.json'

      - name: Restore (latest 18.x, unlocked)
        if: matrix.leg == 'latest'
        run: dotnet restore src/Umbraco.Community.FormsAuditTrail.slnx ${{ env.LATEST_PROPS }} --force-evaluate -p:RestoreLockedMode=false

      - name: Build
        run: dotnet build src/Umbraco.Community.FormsAuditTrail.slnx -c Release --no-restore ${{ matrix.leg == 'latest' && env.LATEST_PROPS || '' }}

      - name: Test
        run: dotnet test src/Umbraco.Community.FormsAuditTrail.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" ${{ matrix.leg == 'latest' && env.LATEST_PROPS || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.leg }}
          path: '**/results.trx'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: bash build/gitleaks.sh "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"

  osv:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        --config=./osv-scanner.toml
        --recursive
        ./

  deps:
    needs: osv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'
          # NuGet cache keyed on the lock files. Not used in publish.yml, so a release never restores from a PR-filled cache.
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore (locked)
        run: dotnet restore src/Umbraco.Community.FormsAuditTrail.slnx --locked-mode
      - name: Vulnerable packages (direct and transitive)
        run: bash build/check-vulnerable.sh
