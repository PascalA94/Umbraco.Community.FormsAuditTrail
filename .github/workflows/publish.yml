name: Publish to NuGet

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

# Two tags pushed close together must not publish at the same time; a running publish is never cancelled half way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # All third-party build and test code (npm, vite, NuGet) runs here with read-only permissions, so none of it can
  # request the OIDC token that publishes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # only for the build.yml and release-checks.yml workflow-run gates below

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # One branch carries both lines, so a tag publishes only from main.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Version files match the tag
        run: bash build/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Umbraco.Community.FormsAuditTrail/Client/.nvmrc

      # The same client gates as build.yml, so a tag never publishes a client that CI did not check.
      - name: Client build and wwwroot drift
        run: |
          cd src/Umbraco.Community.FormsAuditTrail/Client
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build
          cd ../../..
          git diff --exit-code -- src/Umbraco.Community.FormsAuditTrail/wwwroot
          test -z "$(git status --porcelain -- src/Umbraco.Community.FormsAuditTrail/wwwroot)"

      # No NuGet or npm cache here: a release never restores from a cache that pull requests filled.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      # Both lines are restored (locked), built, tested and checked for known advisories before anything is packed.
      # UmbracoMajor is passed as a property for the dotnet steps and as an environment variable for check-vulnerable.sh,
      # which reads the line's assets file.
      - name: Build, test and audit both lines
        run: |
          while read -r line; do
            [ -n "$line" ] || continue
            echo "== Umbraco $line"
            dotnet restore src/Umbraco.Community.FormsAuditTrail.slnx "-p:UmbracoMajor=$line" --locked-mode -warnaserror:NU1903,NU1904
            dotnet build src/Umbraco.Community.FormsAuditTrail.slnx --no-restore -c Release "-p:UmbracoMajor=$line"
            # SQL Server and Slow tests run only in release-checks.yml, which the gate below requires; here CI=true would
            # make the SQL Server tests fail for want of a server.
            dotnet test src/Umbraco.Community.FormsAuditTrail.slnx --no-build -c Release "-p:UmbracoMajor=$line" --filter "Category!=SqlServer&Category!=Slow"
            # Parsed output, never the exit code.
            UmbracoMajor="$line" bash build/check-vulnerable.sh
          done < eng/lines.txt

      # build.yml runs on every push to main, so the tagged commit must already have a green run. The
      # workflow-runs API is scoped to build.yml itself, so a check run of the same name from another workflow or a
      # GitHub App cannot satisfy it. A matrix failure makes the whole run's conclusion non-success.
      - name: build.yml passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f status=completed \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          echo "Successful build.yml push runs for $GITHUB_SHA: $count"
          if [ "$count" -lt 1 ]; then
            echo "build.yml has no successful push run for $GITHUB_SHA" >&2
            exit 1
          fi

      # release-checks.yml runs the SQL Server tests and is dispatched by hand on the merged commit before tagging.
      # Same scoping as above: the API is queried for that workflow file only. The run must also have been dispatched on
      # main, so a run dispatched from a feature branch cannot satisfy the gate.
      - name: release-checks.yml passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/release-checks.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=workflow_dispatch -f status=completed \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length')"
          echo "Successful release-checks.yml runs for $GITHUB_SHA: $count"
          if [ "$count" -lt 1 ]; then
            echo "release-checks.yml has no successful dispatched run for $GITHUB_SHA; dispatch it on this commit before tagging" >&2
            exit 1
          fi

      # One nupkg per line (17.x and 18.x), each carrying wwwroot. Only the package is packed: tests and the demo site
      # are IsPackable=false. pack.sh restores (locked), builds and packs each line, stamps the line's version into the
      # backoffice manifest, and fails unless the package holds staticwebassets/index.js and no lock file.
      - name: Pack
        run: bash build/pack.sh ./artifacts

      - name: One package per line
        run: |
          shopt -s nullglob
          packs=(./artifacts/*.nupkg)
          [ "${#packs[@]}" -eq 2 ] || { echo "expected 2 nupkgs, found ${#packs[@]}" >&2; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  # The only job that can mint the OIDC token. It checks out nothing and runs no project code: it downloads the
  # packages the build job made and pushes them. A required reviewer approves each run (environment `nuget`).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC): no long-lived API key

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
