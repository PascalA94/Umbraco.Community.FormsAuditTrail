name: Release checks

# Manual only. Pull requests never start a database server (R21); run this before tagging a release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'
          # NuGet cache keyed on the lock files, as in build.yml. Not used in publish.yml.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore src/Umbraco.Community.FormsAuditTrail.slnx --locked-mode -warnaserror:NU1903,NU1904

      - name: Build
        run: dotnet build src/Umbraco.Community.FormsAuditTrail.slnx -c Release --no-restore

      # A throwaway container with a random password. It starts after restore and build so that third-party package
      # code never runs while the container (and its environment, readable with docker inspect) exists. The value is
      # masked before it is used, passed to docker by variable name so it is not on a command line, and handed to the
      # test step only, as a step output, never through $GITHUB_ENV.
      # The prefix guarantees SQL Server's complexity rules whatever openssl returns.
      # 2022-latest is deliberate: this is a manual pre-release check, so it should track the current 2022 patch level.
      - name: Start SQL Server
        id: mssql
        run: |
          pw="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "password=$pw" >> "$GITHUB_OUTPUT"
          export MSSQL_SA_PASSWORD="$pw" SQLCMDPASSWORD="$pw"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for _ in $(seq 1 40); do
            if docker exec -e SQLCMDPASSWORD mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q "select 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server did not become ready" >&2
          docker logs mssql | tail -n 20 >&2
          exit 1

      - name: SQL Server tests
        env:
          MSSQL_PASSWORD: ${{ steps.mssql.outputs.password }}
        run: |
          echo "::add-mask::$MSSQL_PASSWORD"
          export FORMSAUDIT_SQLSERVER="Server=127.0.0.1,1433;User Id=sa;Password=$MSSQL_PASSWORD;TrustServerCertificate=True;Encrypt=False;Initial Catalog=master"
          dotnet test src/Umbraco.Community.FormsAuditTrail.slnx -c Release --no-build --filter Category=SqlServer --results-directory "$RUNNER_TEMP/trx" --logger "trx;LogFileName=sqlserver.trx"

      # A skipped test reports as success, so fail unless the trx proves they ran. Raise --min with each new [SqlServerFact].
      - name: Check the SQL Server tests executed
        run: python3 -I build/check-trx.py "$RUNNER_TEMP/trx/sqlserver.trx" --category SqlServer --min 6

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-sqlserver
          path: ${{ runner.temp }}/trx/sqlserver.trx
